name: package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to rebuild and attach assets to (e.g. v1.5.0)'
        required: true

permissions:
  contents: write

jobs:
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Arch build user
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed base-devel cargo git sudo github-cli
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches PKGBUILD
        working-directory: packaging/aur
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          if [ "v$pkgver" != "${{ steps.tag.outputs.tag }}" ]; then
            echo "PKGBUILD pkgver=$pkgver does not match tag ${{ steps.tag.outputs.tag }}" >&2
            exit 1
          fi

      - name: Build package
        working-directory: packaging/aur
        run: sudo -u builder makepkg -f --noconfirm --skipchecksums

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rogtui-package
          path: packaging/aur/*.pkg.tar.zst

      - name: Remove stale package assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null \
            | grep -E '^rogtui(-debug)?-.*\.pkg\.tar\.zst$' \
            | while read -r name; do
                gh release delete-asset "$tag" "$name" -y
              done || true

      - name: Attach package to release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: packaging/aur/*.pkg.tar.zst