name: package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to rebuild and attach assets to (e.g. v1.5.0)'
        required: true

permissions:
  contents: write

jobs:
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Arch build user
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed base-devel cargo git sudo curl jq
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches PKGBUILD
        working-directory: packaging/aur
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          if [ "v$pkgver" != "$TAG" ]; then
            echo "PKGBUILD pkgver=$pkgver does not match tag $TAG" >&2
            exit 1
          fi

      - name: Build package
        working-directory: packaging/aur
        run: sudo -u builder makepkg -f --noconfirm --skipchecksums

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rogtui-package
          path: packaging/aur/*.pkg.tar.zst

      - name: Remove stale package assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$api" \
            | jq -r '.assets[] | select(.name | test("^rogtui(-debug)?-.*\\.pkg\\.tar\\.zst$")) | .id' \
            | while read -r id; do
                curl -fsSL -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
              done

      - name: Attach package to release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: packaging/aur/*.pkg.tar.zst